<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FESTiVillan</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800;900&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Outfit', 'sans-serif'],
                        mono: ['ui-monospace', 'SFMono-Regular', 'Menlo', 'Monaco', 'Consolas', "Liberation Mono", "Courier New", 'monospace'],
                    },
                    colors: {
                        villan: {
                            dark: '#0a0014', // Deep astral purple/black
                            darker: '#05000a', // Void
                            accent: '#00f0ff', // Ethereal cyan
                            danger: '#ff007f', // Vibrant magenta
                            warning: '#ffaa00', // Golden aura
                            purple: '#9d00ff', // Deep psychedelic purple
                            surface: 'rgba(255, 255, 255, 0.03)',
                            surfaceHover: 'rgba(255, 255, 255, 0.08)',
                            border: 'rgba(255, 255, 255, 0.1)'
                        }
                    },
                    animation: {
                        'pulse-fast': 'pulse 1.5s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                        'breathe': 'breathe 8s ease-in-out infinite',
                        'float': 'float 8s ease-in-out infinite',
                        'glow-pulse': 'glow 3s ease-in-out infinite alternate',
                        'flow': 'flow 15s linear infinite',
                        'spin-slow': 'spin 20s linear infinite',
                        'ripple': 'ripple 3s cubic-bezier(0.4, 0, 0.2, 1) infinite',
                        'lightning': 'lightning 2s infinite',
                        'neural-pulse': 'neural-pulse 3s ease-in-out infinite alternate',
                    },
                    keyframes: {
                        breathe: {
                            '0%, 100%': { transform: 'scale(1)', opacity: '0.8' },
                            '50%': { transform: 'scale(1.05)', opacity: '1' },
                        },
                        float: {
                            '0%, 100%': { transform: 'translateY(0) rotate(0deg)' },
                            '50%': { transform: 'translateY(-15px) rotate(2deg)' },
                        },
                        glow: {
                            '0%': { boxShadow: '0 0 15px rgba(157, 0, 255, 0.3), inset 0 0 10px rgba(0, 240, 255, 0.2)' },
                            '100%': { boxShadow: '0 0 40px rgba(157, 0, 255, 0.7), inset 0 0 20px rgba(0, 240, 255, 0.5)' },
                        },
                        flow: {
                            '0%': { backgroundPosition: '0% 50%' },
                            '50%': { backgroundPosition: '100% 50%' },
                            '100%': { backgroundPosition: '0% 50%' }
                        },
                        ripple: {
                            '0%': { transform: 'scale(0.8)', opacity: '1' },
                            '100%': { transform: 'scale(2.5)', opacity: '0' }
                        },
                        lightning: {
                            '0%, 100%': { opacity: '0' },
                            '10%, 90%': { opacity: '0' },
                            '50%': { opacity: '1', filter: 'brightness(2)' },
                            '52%': { opacity: '0' },
                            '54%': { opacity: '1', filter: 'brightness(2)' },
                            '56%': { opacity: '0' }
                        },
                        'neural-pulse': {
                            '0%': { filter: 'drop-shadow(0 0 5px rgba(0, 240, 255, 0.5))' },
                            '100%': { filter: 'drop-shadow(0 0 20px rgba(157, 0, 255, 0.9))' }
                        }
                    },
                    backgroundImage: {
                        'radial-gradient': 'radial-gradient(circle at center, var(--tw-gradient-stops))',
                        'conic-gradient': 'conic-gradient(from 0deg at 50% 50%, var(--tw-gradient-stops))',
                        'iridescent': 'linear-gradient(120deg, #ff007f, #9d00ff, #00f0ff, #ffaa00)',
                        'sacred-geometry': 'url("data:image/svg+xml,%3Csvg width=\'60\' height=\'60\' viewBox=\'0 0 60 60\' xmlns=\'http://www.w3.org/2000/svg\'%3E%3Cg fill=\'none\' fill-rule=\'evenodd\'%3E%3Cg fill=\'%239d00ff\' fill-opacity=\'0.05\'%3E%3Cpath d=\'M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z\'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E")',
                        'pastel-waves': 'linear-gradient(135deg, rgba(157,0,255,0.2) 0%, rgba(0,240,255,0.2) 100%)',
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #05000a;
            color: #f8fafc;
            -webkit-tap-highlight-color: transparent;
            background-image: 
                url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.04'/%3E%3C/svg%3E"),
                radial-gradient(circle at 50% 0%, rgba(157, 0, 255, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 100% 100%, rgba(0, 240, 255, 0.1) 0%, transparent 50%);
            background-attachment: fixed;
        }
        
        ::-webkit-scrollbar {
            display: none;
        }
        
        /* Ethereal Glassmorphism */
        .glass-premium {
            background: linear-gradient(135deg, rgba(255,255,255,0.05) 0%, rgba(255,255,255,0.01) 100%);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-top: 1px solid rgba(255, 255, 255, 0.15);
            border-left: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.4), inset 0 0 20px rgba(157, 0, 255, 0.05);
        }

        .glass-panel {
            background: rgba(10, 0, 20, 0.6);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(157, 0, 255, 0.15);
            box-shadow: inset 0 0 30px rgba(0, 240, 255, 0.03);
        }

        /* Cyber Tarot Card Style */
        .cyber-tarot {
            background: #05000a;
            border: 2px solid transparent;
            background-clip: padding-box;
            position: relative;
            border-radius: 1.5rem;
        }
        .cyber-tarot::before {
            content: '';
            position: absolute;
            top: -2px; right: -2px; bottom: -2px; left: -2px;
            z-index: -1;
            border-radius: 1.6rem;
            background: linear-gradient(180deg, #00f0ff, #9d00ff);
            opacity: 0.5;
            transition: opacity 0.3s ease;
        }
        .cyber-tarot:hover::before {
            opacity: 1;
            box-shadow: 0 0 20px #00f0ff, 0 0 40px #9d00ff;
        }

        /* Iridescent Text & Elements */
        .text-iridescent {
            background: linear-gradient(to right, #00f0ff, #9d00ff, #ff007f, #ffaa00);
            background-size: 300% auto;
            color: transparent;
            -webkit-background-clip: text;
            background-clip: text;
            animation: flow 8s linear infinite;
        }

        .bg-iridescent {
            background: linear-gradient(120deg, #00f0ff, #9d00ff, #ff007f);
            background-size: 200% 200%;
            animation: flow 6s ease infinite;
        }

        /* Text Glows */
        .text-glow-accent {
            text-shadow: 0 0 15px rgba(0, 240, 255, 0.6), 0 0 30px rgba(0, 240, 255, 0.3);
        }
        .text-glow-purple {
            text-shadow: 0 0 15px rgba(157, 0, 255, 0.6), 0 0 30px rgba(157, 0, 255, 0.3);
        }

        /* Neural Wave SVG Path */
        .neural-path {
            stroke-dasharray: 1000;
            stroke-dashoffset: 1000;
            animation: dash 5s linear infinite;
        }
        @keyframes dash {
            to {
                stroke-dashoffset: 0;
            }
        }
    </style>
    </head>
<body>
    <div id="root"></div>
    <script type="module" src="./index.tsx"></script>
<script type="module" src="/index.js"></script></body>
</html>
